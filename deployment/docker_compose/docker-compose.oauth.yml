services:
  background:
    extra_hosts:
      - "localhost:host-gateway"
    environment:
      # OAuth Configuration
      - OKTA_DOMAIN=http://localhost:8089/realms/demo
      - OKTA_CLIENT_ID=onyx
      - OKTA_CLIENT_SECRET=I4QO6ZoA0DNoTHni8sdpeb5WImZEtEhv
      - OAUTH_CLIENT_ID=onyx
      - OAUTH_CLIENT_SECRET=I4QO6ZoA0DNoTHni8sdpeb5WImZEtEhv
      - OKTA_GROUPS_CLAIM=groups
      - OIDC_WELL_KNOWN_URL=http://localhost:8089/realms/demo/.well-known/openid-configuration
      
      # Permission Settings - Simplified
      - OAUTH_PERMISSIONS_ENABLED=false
      - OAUTH_PERMISSION_ENFORCEMENT=false
      - OKTA_GROUP_PROCESSING=true
      
      # Group Mappings - Simplified to admin groups only
      - OKTA_ADMIN_GROUPS=Onyx-Admins
      
      # Authentication Type - CRITICAL
      - AUTH_TYPE=oidc

  api_server:
    extra_hosts:
      - "localhost:host-gateway"
    environment:
      # OAuth Configuration
      - OKTA_DOMAIN=http://localhost:8089/realms/demo
      - OKTA_CLIENT_ID=onyx
      - OKTA_CLIENT_SECRET=I4QO6ZoA0DNoTHni8sdpeb5WImZEtEhv
      - OAUTH_CLIENT_ID=onyx
      - OAUTH_CLIENT_SECRET=I4QO6ZoA0DNoTHni8sdpeb5WImZEtEhv
      - OKTA_GROUPS_CLAIM=groups
      - OIDC_WELL_KNOWN_URL=http://localhost:8089/realms/demo/.well-known/openid-configuration
      
      # Permission Settings - Simplified
      - OAUTH_PERMISSIONS_ENABLED=false
      - OAUTH_PERMISSION_ENFORCEMENT=false
      - OKTA_GROUP_PROCESSING=true
      
      # Group Mappings - Simplified to admin groups only
      - OKTA_ADMIN_GROUPS=Onyx-Admins
      
      # Security Settings
      - OKTA_TOKEN_VALIDATION_STRICT=true
      - OKTA_GROUP_CLAIM_REQUIRED=true
      
      # Authentication Type - CRITICAL
      - AUTH_TYPE=oidc
      


  web_server:
    environment:
      - AUTH_TYPE=oidc
